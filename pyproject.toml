[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "envdoctor-cli"
version = "1.0.0"
description = "A deterministic command-line developer environment diagnostics tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EnvDoctor contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
envdoctor = "envdoctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
